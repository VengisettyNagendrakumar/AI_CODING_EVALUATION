# Normalization Rules
# Format: for each metric, define threshold buckets.
# A raw value <= max gets the associated score.
# Buckets must be in ascending order of max.

cyclomatic_complexity:
  - max: 5
    score: 100
  - max: 10
    score: 90
  - max: 20
    score: 75
  - max: 50
    score: 50
  - max: 999
    score: 20

